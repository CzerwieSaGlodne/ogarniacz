<!DOCTYPE html>
<html lang="pl" data-theme="pastel">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self'; manifest-src 'self'; connect-src 'self' https://*.ts.net:* http://127.0.0.1:47823 http://localhost:47823">
  <meta name="theme-color" content="#4a4460" id="themeColor">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OGARNIACZ">
  <meta name="ogarniacz-version" content="1.4.0">
  <title>OGARNIACZ</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="css/themes.css?v=1.4.0">
  <link rel="stylesheet" href="css/app.css?v=1.4.0">
  <link rel="stylesheet" href="css/mobile.css?v=1.4.0">
</head>
<body>
  <div class="titlebar">OGARNIACZ</div>

  <div class="app">
    <!-- ============ Pasek boczny ============ -->
    <aside class="sidebar">
      <div class="brand">
        <img src="assets/logo.png" alt="">
        <span class="brand-name">OgarNIACZ</span>
        <button class="icon-btn drawer-close mobile-only" id="drawerClose" aria-label="Zamknij menu" title="Zamknij menu">✕</button>
      </div>

      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-3.2-3.2"></path>
        </svg>
        <input id="boardSearch" type="search" placeholder="Szukaj tablic..." aria-label="Szukaj tablic"
               autocomplete="off" spellcheck="false">
      </div>

      <nav class="board-list" id="boardList"></nav>

      <button class="btn add-board" id="addBoardBtn">+ Nowa tablica</button>

      <div class="sidebar-foot">
        <button class="side-link" id="syncBtn" title="Synchronizacja z telefonem">
          <span>🔄</span> Synchronizacja
          <span class="sync-dot" id="syncDot" aria-hidden="true"></span>
        </button>
        <div class="sync-mini" id="syncMini"></div>
        <button class="side-link" id="installBtn" hidden>
          <span>📲</span> Zainstaluj aplikację
        </button>
        <button class="side-link" id="exportBtn">
          <span>💾</span> Zapisz kopię tablic
        </button>
        <button class="side-link" id="importBtn">
          <span>📂</span> Wczytaj kopię tablic
        </button>
        <div class="backup-status" id="backupStatus"></div>
      </div>
    </aside>

    <!-- ============ Tablica ============ -->
    <main class="main">
      <header class="board-head">
        <button class="icon-btn mobile-only" id="menuBtn" aria-label="Otwórz menu tablic" title="Menu tablic">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
               stroke-linecap="round" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16"></path>
          </svg>
        </button>
        <h1 class="board-title" id="boardTitle" title="Kliknij, aby zmienić nazwę">Tablica</h1>
        <span class="board-count" id="boardStats"></span>
        <div class="head-spacer"></div>
        <button class="theme-btn" id="themeBtn" title="Zmień motyw">
          <span class="theme-swatch"><i></i><i></i><i></i></span>
          <span id="themeName">Pastelowy</span>
        </button>
        <button class="icon-btn" id="boardMenuBtn" title="Menu tablicy" aria-label="Menu tablicy">⋯</button>
      </header>

      <div class="board-scroll" id="boardScroll">
        <div class="board-lists" id="boardLists"></div>
        <button class="add-tile" id="addListBtn">+ Dodaj listę</button>
      </div>
    </main>
  </div>

  <div class="drawer-backdrop" id="drawerBackdrop"></div>

  <!-- okno karty, potwierdzenia i menu wstawiane są tutaj -->
  <div id="layer"></div>

  <script src="js/seed.js?v=1.4.0"></script>
  <script src="js/storage.js?v=1.4.0"></script>
  <script src="js/sync-core.js?v=1.4.0"></script>
  <script src="js/store.js?v=1.4.0"></script>
  <script src="js/ui.js?v=1.4.0"></script>
  <script src="js/dnd.js?v=1.4.0"></script>
  <script src="js/sidebar.js?v=1.4.0"></script>
  <script src="js/board.js?v=1.4.0"></script>
  <script src="js/card.js?v=1.4.0"></script>
  <script src="js/sync.js?v=1.4.0"></script>
  <script src="js/app.js?v=1.4.0"></script>
  <script src="js/pwa.js?v=1.4.0"></script>
</body>
</html>
